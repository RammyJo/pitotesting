<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Seven Perfume Admin</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="logo" href="/">SEVEN PERFUME</a><nav><a href="/">Store</a></nav><span class="badge">TEST ADMIN</span></header>
<main class="section adminPage">
  <small>ORDER MANAGEMENT</small><h2>TEST ORDERS.</h2><p>Orders are protected behind an admin token. This demo uses TEST MODE only.</p>
  <section id="loginPanel" class="adminPanel"><label>ADMIN TOKEN<input id="adminToken" type="password" autocomplete="current-password" placeholder="Enter your admin token"></label><button class="gold" id="login" type="button">VIEW ORDERS</button><p id="loginMessage" class="test">The token is never sent in the URL.</p></section>
  <section id="ordersPanel" class="adminPanel" hidden><div class="adminActions"><button class="dark" id="refresh" type="button">Refresh</button><button class="dark" id="clear" type="button">Clear test orders</button><button class="dark" id="logout" type="button">Log out</button></div><div id="orders"></div></section>
</main>
<script src="/admin.js" defer></script>
</body></html>
