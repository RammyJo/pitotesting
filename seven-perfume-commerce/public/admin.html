<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Perfume Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">SEVEN PERFUME</a><nav><a href="/">Store</a></nav><span class="badge">TEST ADMIN</span></header><main class="section"><small>ORDER MANAGEMENT</small><h2>TEST ORDERS.</h2><p>Orders created through the local checkout appear here, including the selected courier and assumed shipping rate.</p><div style="display:flex;gap:8px;margin:20px 0"><button class="dark" id="refresh">Refresh</button><button class="dark" id="clear">Clear all</button></div><div id="orders"></div></main><script>async function load(){const r=await fetch('/api/orders'),j=await r.json();const e=document.querySelector('#orders');if(!j.orders.length){e.innerHTML='<div class="empty-cart">No test orders yet.</div>';return}e.innerHTML=j.orders.map(o=>`<div style="border:1px solid #2a2926;padding:19px;margin:10px 0;background:#10100f"><div style="display:grid;grid-template-columns:1fr 1.1fr 1.25fr 1fr;gap:18px"><div><b>${o.id}</b><div class="muted">${new Date(o.createdAt).toLocaleString()}</div><div class="status" style="margin-top:8px">${o.paymentStatus}</div></div><div><b>${o.customer.name}</b><div class="muted">${o.customer.email}</div><div class="muted">${o.customer.phone}</div><div class="muted">${o.customer.region} · ${o.customer.province} · ${o.customer.city}</div><div class="muted">${o.customer.barangay} · ${o.customer.address}</div></div><div>${o.items.map(x=>`${x.name} × ${x.quantity} — ₱${(x.price*x.quantity).toLocaleString('en-PH')}`).join('<br>')}<div style="margin-top:9px;color:#b9a078">${o.shipping?.courier==='JNT'?'J&T Express':'LBC Express'} · ₱${Number(o.shipping?.fee||0).toLocaleString('en-PH')} · ${Number(o.shipping?.weight||0).toFixed(2)}kg</div></div><div><div>Subtotal <b>₱${Number(o.subtotal||0).toLocaleString('en-PH')}</b></div><div>Shipping <b>₱${Number(o.shipping?.fee||0).toLocaleString('en-PH')}</b></div><div style="font-size:20px;margin-top:8px">Total <b>₱${Number(o.total||0).toLocaleString('en-PH')}</b></div><div class="status">${o.orderStatus}</div></div></div></div>`).join('')}document.querySelector('#refresh').onclick=load;document.querySelector('#clear').onclick=async()=>{if(confirm('Clear all test orders?')){await fetch('/api/orders',{method:'DELETE'});load()}};load()</script></body></html>
